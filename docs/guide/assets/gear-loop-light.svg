<svg xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" width="1440" height="580" fill="none" aria-labelledby="gear-title gear-desc" role="img" viewBox="0 100 1440 580"><title id="gear-title">Gear — inner and outer evolution loops</title><desc id="gear-desc">A twelve-second animation of Gear&apos;s evolution architecture. Inner loop: a Rollout Agent, composed of a harness and model, serves each task by exchanging actions, observations and rewards with an environment. Outer loop: the Meta Agent diagnoses cross-task trajectories and feedback, then edits the harness, designs seed tasks and drives model training. The evolved harness, tasks and model feed directly back into the inner loop for the next iteration.</desc><style>@keyframes gear-serve{0%{opacity:0}4.16667%,95.83333%{opacity:1}}@keyframes gear-draw-serve{0%{stroke-dashoffset:100}4.16667%{stroke-dashoffset:0}}@keyframes gear-innerAction{0%,5%{opacity:0}10%,95.83333%{opacity:1}}@keyframes gear-draw-innerAction{0%,5%{stroke-dashoffset:100}10%{stroke-dashoffset:0}}@keyframes gear-innerReturn{0%,9.16667%{opacity:0}14.72222%,95.83333%{opacity:1}}@keyframes gear-draw-innerReturn{0%,9.16667%{stroke-dashoffset:100}14.72222%{stroke-dashoffset:0}}@keyframes gear-innerFlow{0%,12.5%{opacity:0}15%,95.83333%{opacity:1}}@keyframes gear-draw-innerFlow{0%,12.5%{stroke-dashoffset:100}15%{stroke-dashoffset:0}}@keyframes gear-trajectory{0%,16.94444%{opacity:0}22.5%,95.83333%{opacity:1}}@keyframes gear-draw-trajectory{0%,16.94444%{stroke-dashoffset:100}22.5%{stroke-dashoffset:0}}@keyframes gear-diagnose{0%,21.66667%{opacity:0}25.83333%,95.83333%{opacity:1}}@keyframes gear-draw-diagnose{0%,21.66667%{stroke-dashoffset:100}25.83333%{stroke-dashoffset:0}}@keyframes gear-plan{0%,30%{opacity:0}35%,95.83333%{opacity:1}}@keyframes gear-draw-plan{0%,30%{stroke-dashoffset:100}35%{stroke-dashoffset:0}}@keyframes gear-evolve{0%,30%{opacity:0}35%,95.83333%{opacity:1}}@keyframes gear-draw-evolve{0%,30%{stroke-dashoffset:100}35%{stroke-dashoffset:0}}@keyframes gear-harnessPath{0%,36.11111%{opacity:0}41.66667%,95.83333%{opacity:1}}@keyframes gear-draw-harnessPath{0%,36.11111%{stroke-dashoffset:100}41.66667%{stroke-dashoffset:0}}@keyframes gear-harness{0%,39.16667%{opacity:0}44.16667%,95.83333%{opacity:1}}@keyframes gear-draw-harness{0%,39.16667%{stroke-dashoffset:100}44.16667%{stroke-dashoffset:0}}@keyframes gear-seedPath{0%,44.44444%{opacity:0}50.83333%,95.83333%{opacity:1}}@keyframes gear-draw-seedPath{0%,44.44444%{stroke-dashoffset:100}50.83333%{stroke-dashoffset:0}}@keyframes gear-seeds{0%,48.33333%{opacity:0}53.33333%,95.83333%{opacity:1}}@keyframes gear-draw-seeds{0%,48.33333%{stroke-dashoffset:100}53.33333%{stroke-dashoffset:0}}@keyframes gear-modelPath{0%,56.66667%{opacity:0}63.33333%,95.83333%{opacity:1}}@keyframes gear-draw-modelPath{0%,56.66667%{stroke-dashoffset:100}63.33333%{stroke-dashoffset:0}}@keyframes gear-model{0%,61.66667%{opacity:0}66.66667%,95.83333%{opacity:1}}@keyframes gear-draw-model{0%,61.66667%{stroke-dashoffset:100}66.66667%{stroke-dashoffset:0}}@keyframes gear-merge{0%,66.66667%{opacity:0}71.66667%,95.83333%{opacity:1}}@keyframes gear-draw-merge{0%,66.66667%{stroke-dashoffset:100}71.66667%{stroke-dashoffset:0}}@keyframes gear-return{0%,71.66667%{opacity:0}83.33333%,95.83333%{opacity:1}}@keyframes gear-draw-return{0%,71.66667%{stroke-dashoffset:100}83.33333%{stroke-dashoffset:0}}@keyframes gear-refreshed{0%,83.33333%{opacity:0}86.66667%,95.83333%{opacity:1}}@keyframes gear-draw-refreshed{0%,83.33333%{stroke-dashoffset:100}86.66667%{stroke-dashoffset:0}}@keyframes gear-versions{0%,85.83333%{opacity:0}89.16667%,95.83333%{opacity:1}}@keyframes gear-draw-versions{0%,85.83333%{stroke-dashoffset:100}89.16667%{stroke-dashoffset:0}}@keyframes gear-circulate{0%,12.5%{stroke-dashoffset:0}}.gear-serve{animation:gear-serve 12s linear infinite}.gear-innerAction{animation:gear-innerAction 12s linear infinite}.gear-draw-innerAction{animation:gear-innerAction 12s linear infinite,gear-draw-innerAction 12s linear infinite}.gear-innerReturn{animation:gear-innerReturn 12s linear infinite}.gear-draw-innerReturn{animation:gear-innerReturn 12s linear infinite,gear-draw-innerReturn 12s linear infinite}.gear-trajectory{animation:gear-trajectory 12s linear infinite}.gear-draw-trajectory{animation:gear-trajectory 12s linear infinite,gear-draw-trajectory 12s linear infinite}.gear-diagnose{animation:gear-diagnose 12s linear infinite}.gear-draw-plan{animation:gear-plan 12s linear infinite,gear-draw-plan 12s linear infinite}.gear-evolve{animation:gear-evolve 12s linear infinite}.gear-draw-harnessPath{animation:gear-harnessPath 12s linear infinite,gear-draw-harnessPath 12s linear infinite}.gear-harness{animation:gear-harness 12s linear infinite}.gear-draw-seedPath{animation:gear-seedPath 12s linear infinite,gear-draw-seedPath 12s linear infinite}.gear-seeds{animation:gear-seeds 12s linear infinite}.gear-draw-modelPath{animation:gear-modelPath 12s linear infinite,gear-draw-modelPath 12s linear infinite}.gear-model{animation:gear-model 12s linear infinite}.gear-draw-merge{animation:gear-merge 12s linear infinite,gear-draw-merge 12s linear infinite}.gear-return{animation:gear-return 12s linear infinite}.gear-draw-return{animation:gear-return 12s linear infinite,gear-draw-return 12s linear infinite}.gear-refreshed{animation:gear-refreshed 12s linear infinite}.gear-versions{animation:gear-versions 12s linear infinite}.gear-flow{animation:gear-innerFlow 12s linear infinite,gear-circulate 12s linear infinite}@media (prefers-reduced-motion:reduce){.gear-flow{display:none!important}.gear-motion{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}</style><rect width="1440" height="580" y="100" fill="#fcfdfd"/><g class="gear-motion gear-serve" data-cue="serve"><rect width="536" height="282" x="114" y="214" fill="#f0f3f9" stroke="#d6dfeb" stroke-width="1.2" rx="23"/><rect width="536" he